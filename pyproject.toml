[project]
name = "ai-evaluation-agent"
version = "0.1.0"
description = "A LangChain refund-support agent evaluated with DeepEval metrics."
readme = "README.md"
authors = [
    { name = "Anurag Chaudhary", email = "chaudharyanurag801@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepeval>=4.3.4",
    "google-genai>=3.3.0",
    "groq>=0.37.1",
    "langchain>=1.5.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.21",
    "python-dotenv>=1.2.4",
]

[tool.uv]
# Scripts in agent/ and evaluations/ are run directly; there is no installable package.
package = false
